# Determinism and purity rules for the simulation crate (design §2.1, §2.3, §2.6).

disallowed-methods = [
    # Explicit FMA is fused by definition and falls back to the platform's `fmaf`.
    { path = "f32::mul_add", reason = "platform-dependent; see design §2.6" },
    { path = "f64::mul_add", reason = "platform-dependent; see design §2.6" },
    # std's transcendental functions have unspecified precision: use `libm`.
    { path = "f32::exp", reason = "use libm::expf (design §2.6)" },
    { path = "f32::exp2", reason = "use libm::exp2f (design §2.6)" },
    { path = "f32::exp_m1", reason = "use libm::expm1f (design §2.6)" },
    { path = "f32::ln", reason = "use libm::logf (design §2.6)" },
    { path = "f32::ln_1p", reason = "use libm::log1pf (design §2.6)" },
    { path = "f32::log", reason = "use libm (design §2.6)" },
    { path = "f32::log2", reason = "use libm::log2f (design §2.6)" },
    { path = "f32::log10", reason = "use libm::log10f (design §2.6)" },
    { path = "f32::powf", reason = "use libm::powf (design §2.6)" },
    { path = "f32::powi", reason = "use libm::powf (design §2.6)" },
    { path = "f32::cbrt", reason = "use libm::cbrtf (design §2.6)" },
    { path = "f32::hypot", reason = "use libm::hypotf (design §2.6)" },
    { path = "f32::sin", reason = "use libm::sinf (design §2.6)" },
    { path = "f32::cos", reason = "use libm::cosf (design §2.6)" },
    { path = "f32::tan", reason = "use libm::tanf (design §2.6)" },
    { path = "f32::asin", reason = "use libm::asinf (design §2.6)" },
    { path = "f32::acos", reason = "use libm::acosf (design §2.6)" },
    { path = "f32::atan", reason = "use libm::atanf (design §2.6)" },
    { path = "f32::atan2", reason = "use libm::atan2f (design §2.6)" },
    { path = "f32::sinh", reason = "use libm::sinhf (design §2.6)" },
    { path = "f32::cosh", reason = "use libm::coshf (design §2.6)" },
    { path = "f32::tanh", reason = "use libm::tanhf (design §2.6)" },
    { path = "f64::exp", reason = "use libm::exp (design §2.6)" },
    { path = "f64::ln", reason = "use libm::log (design §2.6)" },
    { path = "f64::powf", reason = "use libm::pow (design §2.6)" },
    { path = "f64::powi", reason = "use libm::pow (design §2.6)" },
    { path = "f64::sin", reason = "use libm::sin (design §2.6)" },
    { path = "f64::cos", reason = "use libm::cos (design §2.6)" },
    { path = "f64::tanh", reason = "use libm::tanh (design §2.6)" },
    # The simulation never touches the filesystem: callers pass data in (design §2.1).
    { path = "std::fs::read", reason = "the sim crate has no filesystem access (design §2.1)" },
    { path = "std::fs::read_to_string", reason = "the sim crate has no filesystem access (design §2.1)" },
    { path = "std::fs::write", reason = "the sim crate has no filesystem access (design §2.1)" },
    { path = "std::fs::read_dir", reason = "the sim crate has no filesystem access (design §2.1)" },
    { path = "std::fs::File::open", reason = "the sim crate has no filesystem access (design §2.1)" },
    { path = "std::fs::File::create", reason = "the sim crate has no filesystem access (design §2.1)" },
    { path = "std::fs::OpenOptions::open", reason = "the sim crate has no filesystem access (design §2.1)" },
]

disallowed-types = [
    # Hash-map iteration order is random; use BTreeMap/BTreeSet or Vec (design §2.3).
    { path = "std::collections::HashMap", reason = "iteration order is nondeterministic (design §2.3)" },
    { path = "std::collections::HashSet", reason = "iteration order is nondeterministic (design §2.3)" },
]

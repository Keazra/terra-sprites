[package]
name = "terra-sim"
description = "The Terra Sprites simulation: no terminal, no filesystem."
version.workspace = true
edition.workspace = true

[dependencies]
libm = "0.2.16"
rand_chacha = { version = "0.10.0", features = ["serde"] }
rmp-serde = "1.3.1"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"

[package]
name = "terra-sim"
description = "The Terra Sprites simulation: no terminal, no filesystem."
version.workspace = true
edition.workspace = true

[dependencies]
libm = "0.2.16"
rand_chacha = { version = "0.10.0", features = ["serde"] }
rmp-serde = "1.3.1"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"

# Benchmarks of a tick and its costliest parts (design §3.9, §7.4 A5):
# `cargo bench -p terra-sim`.
[[bench]]
name = "tick"
harness = false

# The baseline program's report is tested with everything else (design §7.6).
[[example]]
name = "baseline"
test = true

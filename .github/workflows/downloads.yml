# Downloads: ready-made copies of the game for a release, so players without
# Rust can play (#345). The owner runs it from the Actions tab (Downloads >
# Run workflow) with the release's tag, such as v0.2.0. It builds the game in
# release mode on Windows, a Mac and Linux, zips each copy with both licences
# and a README.txt on running it (from .github/downloads/), and puts the
# three zips on a draft release for the tag. Sessions can't make releases,
# but a workflow can. It never publishes one: the owner checks the zips and
# publishes it (docs/agents/releases.md, "Making one").
#
# What it builds: the commit it runs on, the newest on the branch or tag
# picked under "Use workflow from" (main, unless told otherwise). Only that,
# so code from someone else's copy of the repository never runs here, where
# it could leave a poisoned cache behind for main's other workflows.
# - A tag already on GitHub must be on that commit: to build a tag's commit,
#   run the workflow from the tag. Otherwise publishing the release makes
#   the tag on the commit built.
# - The game at that commit must say the tag's version, or nothing is built.
#   A tag with a hyphen, such as a test's (v0.1.0-test.1), only warns.
#
# Where the zips go:
# - Onto the draft release for the tag, when there's one (say, made by hand
#   on GitHub) and it names the commit built or its branch, replacing any
#   zips of the same name. The draft is pinned to the commit built, so
#   publishing it tags what was built.
# - Otherwise onto a new draft release, titled from the first line of
#   docs/releases/<tag>.md at that commit, with that file's text as its
#   description. A tag with a hyphen, such as v0.3.0-beta.1, makes a
#   pre-release.
# - A release that's already published is refused, so nothing reaches
#   players before the owner has checked it.
#
# A pull request that changes this file or the READMEs runs the builds as a
# dry run: the zips stay on the run, under Artifacts, and no release is
# touched.

name: Downloads

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.2.0
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/downloads.yml
      - .github/downloads/**

# The jobs only read the code, except the two below that look up and make
# the release.
permissions:
  contents: read

# One run at a time for a tag, so two can't both make its release. A pull
# request's newer push stops its older run.
concurrency:
  group: downloads-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: what to build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub lists draft releases only to a token that can write.
    permissions:
      contents: write
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      has_draft: ${{ steps.resolve.outputs.has_draft }}
    steps:
      - name: Check the tag and find its release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          if [ "$EVENT" = pull_request ]; then
            # A dry run: the zips are named after the pull request.
            { echo "name=pr-$PR"; echo "has_draft=false"; } >> "$GITHUB_OUTPUT"
            echo "A dry run for pull request #$PR, from $COMMIT: no release is touched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Only a version tag, which also keeps the tag safe in the URLs,
          # queries and file names below.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || fail "A release's tag looks like v0.2.0, or v0.3.0-beta.1."
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            from="the commit of the tag $GITHUB_REF_NAME"
          else
            from="the newest commit on $GITHUB_REF_NAME"
          fi

          # A tag already on GitHub must be on the commit built. An annotated
          # tag points at a tag object, which points at the commit.
          tag_object=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | \"\(.object.type) \(.object.sha)\"")
          tag_on_github=false
          if [ -n "$tag_object" ]; then
            tag_on_github=true
            read -r type tag_commit <<<"$tag_object"
            if [ "$type" = tag ]; then
              tag_commit=$(gh api "repos/$GH_REPO/git/tags/$tag_commit" --jq .object.sha)
            fi
            [ "$tag_commit" = "$COMMIT" ] \
              || fail "The tag $TAG is on $tag_commit, but this run is on $COMMIT, $from. Run it from the tag instead (under \"Use workflow from\", or gh workflow run downloads.yml --ref $TAG -f tag=$TAG)."
          fi

          # The release for the tag: a draft takes the zips, a published one
          # is refused. Drafts make no tag, so there can be several.
          releases=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.draft) \(.target_commitish)\"")
          has_draft=false
          draft_target=""
          if [ -n "$releases" ]; then
            [ "$(wc -l <<<"$releases")" -eq 1 ] \
              || fail "There's more than one release for $TAG. Delete all but one, then run this again."
            read -r is_draft draft_target <<<"$releases"
            [ "$is_draft" = true ] \
              || fail "The release for $TAG is already published. This only adds downloads to a draft release, so that nothing reaches players before it's been checked."
            has_draft=true
            # Until the tag exists, the draft's own commit (or branch) is
            # where publishing would make it, so it must be the one built.
            if [ "$tag_on_github" = false ]; then
              draft_commit=$(gh api "repos/$GH_REPO/commits/$draft_target" --jq .sha)
              [ "$draft_commit" = "$COMMIT" ] \
                || fail "The draft release for $TAG names $draft_commit, but this run is on $COMMIT, $from. Point the draft at this commit, or push the tag on that one and run this from the tag."
            fi
          fi

          # The game at that commit names the tag's version, so --version
          # says the release. Checked before anything's built. A tag with a
          # hyphen may differ, for a test (v0.1.0-test.1).
          version=$(gh api "repos/$GH_REPO/contents/Cargo.toml?ref=$COMMIT" -H "Accept: application/vnd.github.raw+json" \
            | sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p')
          if [ "v$version" != "$TAG" ]; then
            mismatch="The game at $COMMIT says it's version $version, not ${TAG#v}."
            [[ "$TAG" == *-* ]] \
              || fail "$mismatch Raise its version first (docs/agents/releases.md, \"Making one\")."
            echo "::warning::$mismatch That's fine for a test tag."
            echo "$mismatch That's fine for a test tag." >> "$GITHUB_STEP_SUMMARY"
          fi

          { echo "name=$TAG"; echo "has_draft=$has_draft"; } >> "$GITHUB_OUTPUT"
          {
            echo "Building $TAG from $COMMIT, $from."
            if [ "$has_draft" = true ]; then
              echo "The zips go on its draft release."
            else
              echo "There's no release for $TAG yet, so the zips go on a new draft release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.name }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            program: terra-sprites.exe
            readme: windows
            # Builds Microsoft's C runtime into the program, so it runs on a
            # PC that hasn't got the Visual C++ runtime installed.
            rustflags: -C target-feature=+crt-static
          - name: mac-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
            program: terra-sprites
            readme: mac
          - name: linux-x86_64
            # The oldest Ubuntu GitHub offers, since a program built against
            # an older glibc (2.35) runs on more Linuxes. Move it on when
            # GitHub retires this one.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            program: terra-sprites
            readme: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Not ZIP, which zip reads as options of its own.
      FOLDER: terra-sprites-${{ needs.resolve.outputs.name }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # No cache: each download is built from nothing, so nothing another
      # run left behind can end up in it.
      - uses: dtolnay/rust-toolchain@stable
      # Three of the four targets CI's determinism check proves play a seed
      # the same (design §2.6, §7.5).
      - name: The runner builds for the promised target
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "expected ${{ matrix.target }}, but this runner builds for $host"
            exit 1
          fi
          echo "${{ matrix.name }}: built with $(rustc -V)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: cargo build --release --locked -p terra-tui
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: The program says its version and commit
        shell: bash
        run: |
          said=$("target/release/${{ matrix.program }}" --version)
          echo "$said"
          commit=$(git rev-parse --short HEAD)
          if [[ "$said" != *"($commit)" ]]; then
            echo "expected it to name the commit it was built from, $commit"
            exit 1
          fi
      - name: Zip it with the licences and its README
        shell: bash
        run: |
          mkdir "$FOLDER"
          cp "target/release/${{ matrix.program }}" LICENSE-MIT LICENSE-APACHE "$FOLDER/"
          cp ".github/downloads/README-${{ matrix.readme }}.txt" "$FOLDER/README.txt"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$FOLDER.zip" "$FOLDER"
            7z l "$FOLDER.zip"
          else
            # zip keeps the program executable.
            zip -r -X "$FOLDER.zip" "$FOLDER"
            unzip -l "$FOLDER.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FOLDER }}
          path: ${{ env.FOLDER }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: draft release
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.name }}
      COMMIT: ${{ github.sha }}
      HAS_DRAFT: ${{ needs.resolve.outputs.has_draft }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docs/releases
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: terra-sprites-*
          path: zips
          merge-multiple: true
      - name: Put the zips on a draft release
        run: |
          set -euo pipefail
          ls -l zips
          [ "$(find zips -name '*.zip' | wc -l)" -eq 3 ] || { echo "::error::Expected three zips."; exit 1; }
          if [ "$HAS_DRAFT" = true ]; then
            # Still a draft, just before it's touched.
            is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$is_draft" != true ]; then
              echo "::error::The release for $TAG was published while this ran, so its zips weren't added."
              exit 1
            fi
            gh release edit "$TAG" --target "$COMMIT"
            gh release upload "$TAG" zips/*.zip --clobber
          else
            # The notes' heading is the release's title, and the rest its
            # description.
            file="docs/releases/$TAG.md"
            notes=$(mktemp)
            title=""
            if [ -f "$file" ]; then
              title=$(sed -n '1s/^# *//p' "$file")
              if [ -n "$title" ]; then
                tail -n +2 "$file" | sed '/./,$!d' > "$notes"
              else
                cp "$file" "$notes"
              fi
            else
              echo "Downloads for $TAG, built from $COMMIT. There was no $file at that commit to describe it." > "$notes"
            fi
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" zips/*.zip --draft --target "$COMMIT" \
              --title "${title:-$TAG}" --notes-file "$notes" "${prerelease[@]}"
          fi
          url=$(gh release view "$TAG" --json url --jq .url)
          {
            echo "## Downloads for $TAG"
            echo
            echo "The zips are on the draft release: $url"
            echo
            echo "Check all three are there, open the one for your computer, then publish the release (Edit, then Publish release). Nobody else can see it until then."
          } >> "$GITHUB_STEP_SUMMARY"

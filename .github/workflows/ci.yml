name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints (including the simulation's determinism rules)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: The simulation crate has no terminal dependencies (design §2.1)
        shell: bash
        run: |
          if cargo tree -p terra-sim -e normal --prefix none | grep -Ei '^(ratatui|crossterm)'; then
            echo "terra-sim must not depend on terminal crates"
            exit 1
          fi
